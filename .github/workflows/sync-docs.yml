name: Sync Docs

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync README derivable sections
        run: python scripts/update_readme.py

      - name: Install git-cliff
        run: |
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v2.6.1/git-cliff-2.6.1-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo install git-cliff-2.6.1/git-cliff /usr/local/bin/git-cliff

      - name: Generate CHANGELOG
        run: git-cliff --config .git-cliff.toml --verbose --output CHANGELOG.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: auto-sync README & CHANGELOG"
            git push origin HEAD:master
          else
            echo "docs up to date, nothing to commit"
          fi

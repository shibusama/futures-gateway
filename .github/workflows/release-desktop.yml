name: Release Desktop

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build PyInstaller bundle
        run: python -m PyInstaller --noconfirm FuturesTerminal.spec

      - name: Create zip
        shell: pwsh
        run: |
          $zip = "dist/FuturesTerminal-win64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist/FuturesTerminal/*" -DestinationPath $zip

      - name: Parse version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = $tag -replace '^desktop-v',''
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FuturesTerminal-win64.zip
          generate_release_notes: true
          name: Desktop v${{ steps.ver.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>登录 · 期界</title>
<link rel="stylesheet" href="css/styles.css?v=12" />
<style>
  html, body { height: 100%; }
  body.login-page {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .login-card {
    width: min(340px, 88vw);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 26px 24px 20px;
    box-shadow: var(--shadow);
    box-sizing: border-box;
  }
  .login-brand {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 16px; margin-bottom: 4px;
  }
  .login-brand svg { color: var(--accent); flex: none; }
  .login-sub {
    color: var(--muted); font-size: 12px; line-height: 1.6;
    margin: 6px 0 16px;
  }
  .login-field { display: flex; flex-direction: column; gap: 6px; }
  .login-field label { font-size: 13px; color: var(--muted); }
  .login-field input {
    background: var(--surface2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    padding: 9px 10px;
    font-size: 14px;
    outline: none;
  }
  .login-field input:focus { border-color: var(--accent); }
  .login-err {
    min-height: 18px; margin-top: 10px;
    font-size: 12px; color: var(--down);
  }
  .login-err.ok { color: var(--up); }
  .login-btn {
    width: 100%; margin-top: 6px;
    border: none; border-radius: 6px;
    background: var(--accent); color: #fff;
    padding: 10px 0; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .login-btn:disabled { opacity: .55; cursor: default; }
  .login-foot {
    margin-top: 14px; text-align: center;
    color: var(--muted); font-size: 11px;
  }
</style>
<script>
  // 与主界面一致：记忆/跟随系统主题
  (function () {
    var dark = false;
    try {
      var saved = localStorage.getItem("ftd-theme");
      if (saved === "dark") dark = true;
      else if (saved !== "light") dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    } catch (_) {
      dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.style.colorScheme = dark ? "dark" : "light";
  })();
</script>
</head>
<body class="login-page">
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="login-brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>期界 · 期货交易终端</span>
    </div>
    <div class="login-sub" id="login-sub">该地址从外部访问，需要输入访问口令。</div>
    <div class="login-field">
      <label for="password">访问口令</label>
      <input id="password" name="password" type="password" required
             placeholder="请输入访问口令" autocomplete="current-password" />
    </div>
    <div class="login-err" id="login-err" role="alert"></div>
    <button type="submit" class="login-btn" id="login-btn">进入</button>
    <div class="login-foot">口令仅在 config.json 中哈希存储</div>
  </form>
  <script src="js/login.js"></script>
</body>
</html>

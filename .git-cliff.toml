[changelog]
header = """
# Changelog

本项目所有重要变更均记录在此文件。本文件由 git-cliff 根据提交历史自动生成，请勿手改。
"""
body = """
{%- if version %}\n## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}{%- else %}\n## [unreleased]{%- endif %}\n{% for group, commits in commits | group_by(attribute="group") %}\n### {{ group | striptags | trim | upper_first }}\n{% for commit in commits %}\n- {{ commit.message | upper_first }}\n{%- endfor %}\n{%- endfor %}\n"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""
postprocessors = [
  { pattern = '\(.*\)', replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactor" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Testing" },
  { message = "^chore", group = "Miscellaneous Tasks" },
  { message = "^build", group = "Build" },
  { message = "^style", group = "Style" },
  { message = "^ci", group = "Continuous Integration" },
  { body = ".*security", group = "Security" },
]
filter_commits = false
